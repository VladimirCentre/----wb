<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Доходы по сменам — трекер</title>
    <style>
      :root {
        --bg: #f5f2ed;
        --ink: #1f2328;
        --muted: #6b6f76;
        --card: #ffffff;
        --accent: #2f7d5c;
        --accent-2: #d8693a;
        --danger: #c44536;
        --shadow: rgba(31, 35, 40, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 20%, #fbe9d6, transparent 55%),
          radial-gradient(circle at 80% 0%, #e0efe6, transparent 50%),
          var(--bg);
        min-height: 100vh;
      }
      header {
        padding: 28px 20px 8px;
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(26px, 3vw, 38px);
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-family: "Arial", sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 12px 20px 40px;
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 0.9fr);
        gap: 20px;
      }
      .panel {
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 12px 30px var(--shadow);
        padding: 16px;
      }
      .month-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        font-family: "Arial", sans-serif;
      }
      .month-title {
        font-size: 16px;
        font-weight: 600;
      }
      .month-actions {
        display: flex;
        gap: 8px;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        font-family: "Arial", sans-serif;
      }
      button.primary {
        background: var(--accent);
        color: white;
        box-shadow: 0 8px 16px rgba(47, 125, 92, 0.25);
      }
      button.ghost {
        background: #f0ebe3;
        color: var(--ink);
      }
      button.danger {
        background: #f8d7d7;
        color: var(--danger);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
      }
      .weekday {
        text-align: center;
        font-size: 12px;
        font-family: "Arial", sans-serif;
        color: var(--muted);
        padding: 6px 0;
      }
      .day {
        background: #fbfaf8;
        border: 1px solid #eee7df;
        border-radius: 12px;
        padding: 8px;
        min-height: 78px;
        display: grid;
        gap: 6px;
        cursor: pointer;
      }
      .day.other {
        opacity: 0.4;
      }
      .day.selected {
        outline: 2px solid var(--accent-2);
        outline-offset: 1px;
      }
      .day-num {
        font-size: 13px;
        font-weight: 600;
      }
      .money {
        font-family: "Arial", sans-serif;
        font-size: 12px;
      }
      .money.gross {
        color: var(--accent);
      }
      .money.penalty {
        color: var(--danger);
      }
      .money.return {
        color: #2b6cb0;
      }
      .money.net {
        color: #1b4332;
        font-weight: 600;
      }
      .summary {
        display: grid;
        gap: 12px;
      }
      .summary h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .stat {
        background: #f6f2ec;
        border-radius: 12px;
        padding: 10px 12px;
        font-family: "Arial", sans-serif;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .stat strong {
        font-size: 14px;
      }
      .editor {
        display: grid;
        gap: 12px;
      }
      label {
        font-family: "Arial", sans-serif;
        font-size: 12px;
        color: var(--muted);
      }
      input[type="number"],
      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #e1ded8;
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
      }
      .penalties {
        display: grid;
        gap: 8px;
      }
      .returns {
        display: grid;
        gap: 8px;
      }
      .penalty-item {
        border: 1px solid #efe9e1;
        border-radius: 10px;
        padding: 8px 10px;
        display: grid;
        gap: 4px;
        font-family: "Arial", sans-serif;
        font-size: 12px;
      }
      .penalty-item header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 0;
        margin: 0;
      }
      .sync {
        display: grid;
        gap: 8px;
        font-family: "Arial", sans-serif;
        font-size: 12px;
      }
      .sync-status {
        font-size: 12px;
        color: var(--muted);
      }
      .pin-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
      }
      .sync textarea {
        width: 100%;
        min-height: 64px;
        resize: vertical;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #e1ded8;
        font-size: 12px;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Доходы по сменам</h1>
      <p>Всё локально. Синхронизация через код/ссылку.</p>
    </header>
    <main>
      <section class="panel">
        <div class="month-bar">
          <div class="month-title" id="month-title"></div>
          <div class="month-actions">
            <button class="ghost" id="prev-month">← Месяц</button>
            <button class="ghost" id="next-month">Месяц →</button>
          </div>
        </div>
        <div class="calendar" id="calendar"></div>
      </section>
      <section class="panel summary">
        <h2>Итоги месяца</h2>
        <div class="stat">
          <span>Грязный доход</span>
          <strong id="gross-total">0.00 ₽</strong>
        </div>
        <div class="stat">
          <span>Штрафы</span>
          <strong id="penalty-total">0.00 ₽</strong>
        </div>
        <div class="stat">
          <span>Возвраты</span>
          <strong id="return-total">0.00 ₽</strong>
        </div>
        <div class="stat">
          <span>Чистый доход</span>
          <strong id="net-total">0.00 ₽</strong>
        </div>

        <div class="editor">
          <h2 id="day-title">День</h2>
          <div>
            <label for="gross-input">Заработок за день</label>
            <input id="gross-input" type="text" inputmode="decimal" placeholder="Сумма" />
          </div>
          <div>
            <label>Штрафы</label>
            <div id="penalties" class="penalties"></div>
          </div>
          <div>
            <label for="penalty-amount">Добавить штраф</label>
            <input id="penalty-amount" type="number" step="0.01" placeholder="Сумма штрафа" />
            <input id="penalty-comment" type="text" placeholder="Комментарий" />
            <button class="danger" id="add-penalty">Добавить штраф</button>
          </div>
          <div>
            <label>Возвраты</label>
            <div id="returns" class="returns"></div>
          </div>
          <div>
            <label for="return-amount">Добавить возврат</label>
            <input id="return-amount" type="number" step="0.01" placeholder="Сумма возврата" />
            <input id="return-comment" type="text" placeholder="Комментарий" />
            <button class="primary" id="add-return">Добавить возврат</button>
          </div>
        </div>

        <div class="sync">
          <strong>Синхронизация</strong>
          <div class="pin-row">
            <input id="sync-pin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="PIN (4-6 цифр)" />
            <button class="ghost" id="set-pin">Подключить</button>
          </div>
          <div class="sync-status" id="sync-status">Автосинхронизация отключена.</div>
          <button class="primary" id="make-sync">Сгенерировать код/ссылку</button>
          <textarea id="sync-output" readonly placeholder="Здесь появится код или ссылка"></textarea>
          <button class="ghost" id="import-sync">Импортировать из кода/ссылки</button>
          <textarea id="sync-input" placeholder="Вставь код или ссылку сюда"></textarea>
        </div>
      </section>
      <section class="panel summary">
        <h2>Итоги недели</h2>
        <div class="stat">
          <span>Период</span>
          <strong id="week-range">—</strong>
        </div>
        <div class="stat">
          <span>Грязный доход</span>
          <strong id="week-gross">0.00 ₽</strong>
        </div>
        <div class="stat">
          <span>Штрафы</span>
          <strong id="week-penalty">0.00 ₽</strong>
        </div>
        <div class="stat">
          <span>Возвраты</span>
          <strong id="week-return">0.00 ₽</strong>
        </div>
        <div class="stat">
          <span>Чистый доход</span>
          <strong id="week-net">0.00 ₽</strong>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const STORAGE_KEY = "finance_tracker_v1";
      const SYNC_META_KEY = "finance_sync_meta_v1";
      const WEEKDAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

      const SUPABASE_URL = "https://jzragiuywauieqvlcpvc.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_jbdAnqG05XBCLYFk0PxiHQ_3sI9gjLb";
      const supabaseClient =
        window.supabase && window.supabase.createClient
          ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
          : null;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let current = new Date(today.getFullYear(), today.getMonth(), 1);
      let selected = new Date(today);

      const state = {
        days: {},
      };

      const calendarEl = document.getElementById("calendar");
      const monthTitleEl = document.getElementById("month-title");
      const dayTitleEl = document.getElementById("day-title");
      const grossInput = document.getElementById("gross-input");
      const penaltiesEl = document.getElementById("penalties");
      const penaltyAmount = document.getElementById("penalty-amount");
      const penaltyComment = document.getElementById("penalty-comment");
      const returnsEl = document.getElementById("returns");
      const returnAmount = document.getElementById("return-amount");
      const returnComment = document.getElementById("return-comment");
      const grossTotalEl = document.getElementById("gross-total");
      const penaltyTotalEl = document.getElementById("penalty-total");
      const returnTotalEl = document.getElementById("return-total");
      const netTotalEl = document.getElementById("net-total");
      const weekRangeEl = document.getElementById("week-range");
      const weekGrossEl = document.getElementById("week-gross");
      const weekPenaltyEl = document.getElementById("week-penalty");
      const weekReturnEl = document.getElementById("week-return");
      const weekNetEl = document.getElementById("week-net");
      const syncOutput = document.getElementById("sync-output");
      const syncInput = document.getElementById("sync-input");
      const syncPinInput = document.getElementById("sync-pin");
      const setPinBtn = document.getElementById("set-pin");
      const syncStatusEl = document.getElementById("sync-status");

      const fmtDateKey = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      };

      const startOfWeek = (date) => {
        const d = new Date(date);
        const day = d.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        d.setDate(d.getDate() + diff);
        d.setHours(0, 0, 0, 0);
        return d;
      };

      const formatMoney = (value) =>
        value.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₽";

      const load = () => {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          state.days = JSON.parse(raw);
          Object.values(state.days).forEach((day) => {
            if (!Array.isArray(day.penalties)) day.penalties = [];
            if (!Array.isArray(day.returns)) day.returns = [];
            const gross = parseFloat(day.gross || "0");
            day.gross = isNaN(gross) ? 0 : gross;
          });
        }
      };

      const save = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.days));
      };

      const getDayData = (date) => {
        const key = fmtDateKey(date);
        if (!state.days[key]) {
          state.days[key] = { gross: 0, penalties: [], returns: [] };
        }
        return state.days[key];
      };

      const updateDay = (date, updates) => {
        const day = getDayData(date);
        Object.assign(day, updates);
        syncState.pendingChanges = true;
        save();
        safeRender();
        scheduleSyncPush();
      };

      const buildCalendarDays = () => {
        const start = new Date(current.getFullYear(), current.getMonth(), 1);
        const end = new Date(current.getFullYear(), current.getMonth() + 1, 0);
        const startDay = (start.getDay() + 6) % 7;
        const days = [];

        for (let i = 0; i < startDay; i++) {
          const d = new Date(start);
          d.setDate(d.getDate() - (startDay - i));
          days.push({ date: d, other: true });
        }
        for (let i = 1; i <= end.getDate(); i++) {
          days.push({ date: new Date(current.getFullYear(), current.getMonth(), i), other: false });
        }
        while (days.length % 7 !== 0) {
          const d = new Date(end);
          d.setDate(end.getDate() + (days.length % 7 === 0 ? 0 : days.length % 7));
          const last = days[days.length - 1].date;
          const next = new Date(last);
          next.setDate(last.getDate() + 1);
          days.push({ date: next, other: true });
        }
        return days;
      };

      const renderCalendar = () => {
        calendarEl.innerHTML = "";
        WEEKDAYS.forEach((wd) => {
          const label = document.createElement("div");
          label.className = "weekday";
          label.textContent = wd;
          calendarEl.appendChild(label);
        });

        const days = buildCalendarDays();
        days.forEach((entry) => {
          const { date, other } = entry;
          const dayData = getDayData(date);
          const penaltiesSum = dayData.penalties.reduce((sum, p) => sum + p.amount, 0);
          const returnsSum = dayData.returns.reduce((sum, r) => sum + r.amount, 0);
          const net = dayData.gross + returnsSum - penaltiesSum;

          const cell = document.createElement("div");
          cell.className = "day";
          if (other) cell.classList.add("other");
          if (fmtDateKey(date) === fmtDateKey(selected)) cell.classList.add("selected");

          const num = document.createElement("div");
          num.className = "day-num";
          num.textContent = date.getDate();

          const gross = document.createElement("div");
          gross.className = "money gross";
          gross.textContent = `+${formatMoney(dayData.gross)}`;

          const penalty = document.createElement("div");
          penalty.className = "money penalty";
          penalty.textContent = `-${formatMoney(penaltiesSum)}`;

          const returns = document.createElement("div");
          returns.className = "money return";
          returns.textContent = `+${formatMoney(returnsSum)}`;

          const netEl = document.createElement("div");
          netEl.className = "money net";
          netEl.textContent = formatMoney(net);

          cell.appendChild(num);
          cell.appendChild(gross);
          cell.appendChild(penalty);
          cell.appendChild(returns);
          cell.appendChild(netEl);

          cell.addEventListener("click", () => {
            selected = new Date(date);
            safeRender();
          });

          calendarEl.appendChild(cell);
        });
      };

      const renderEditor = () => {
        const dayData = getDayData(selected);
        dayTitleEl.textContent = selected.toLocaleDateString("ru-RU", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
        grossInput.value = dayData.gross ? dayData.gross.toFixed(2) : "";
        penaltiesEl.innerHTML = "";
        returnsEl.innerHTML = "";

        dayData.penalties.forEach((penalty) => {
          const item = document.createElement("div");
          item.className = "penalty-item";

          const header = document.createElement("header");
          const amount = document.createElement("strong");
          amount.textContent = `-${formatMoney(penalty.amount)}`;
          const remove = document.createElement("button");
          remove.className = "ghost";
          remove.type = "button";
          remove.textContent = "Удалить";
          remove.addEventListener("click", () => {
            dayData.penalties = dayData.penalties.filter((p) => p.id !== penalty.id);
            updateDay(selected, { penalties: dayData.penalties });
          });

          header.appendChild(amount);
          header.appendChild(remove);

          const comment = document.createElement("div");
          comment.textContent = penalty.comment || "Без комментария";

          item.appendChild(header);
          item.appendChild(comment);
          penaltiesEl.appendChild(item);
        });

        dayData.returns.forEach((ret) => {
          const item = document.createElement("div");
          item.className = "penalty-item";

          const header = document.createElement("header");
          const amount = document.createElement("strong");
          amount.textContent = `+${formatMoney(ret.amount)}`;
          const remove = document.createElement("button");
          remove.className = "ghost";
          remove.type = "button";
          remove.textContent = "Удалить";
          remove.addEventListener("click", () => {
            dayData.returns = dayData.returns.filter((r) => r.id !== ret.id);
            updateDay(selected, { returns: dayData.returns });
          });

          header.appendChild(amount);
          header.appendChild(remove);

          const comment = document.createElement("div");
          comment.textContent = ret.comment || "Без комментария";

          item.appendChild(header);
          item.appendChild(comment);
          returnsEl.appendChild(item);
        });
      };

      const renderTotals = () => {
        let grossTotal = 0;
        let penaltyTotal = 0;
        let returnTotal = 0;
        const year = current.getFullYear();
        const month = current.getMonth();
        Object.entries(state.days).forEach(([key, value]) => {
          const parts = key.split("-").map((part) => parseInt(part, 10));
          const date =
            parts.length === 3 ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date(key);
          if (date.getFullYear() === year && date.getMonth() === month) {
            grossTotal += value.gross || 0;
            penaltyTotal += (value.penalties || []).reduce((sum, p) => sum + p.amount, 0);
            returnTotal += (value.returns || []).reduce((sum, r) => sum + r.amount, 0);
          }
        });
        grossTotalEl.textContent = formatMoney(grossTotal);
        penaltyTotalEl.textContent = formatMoney(penaltyTotal);
        returnTotalEl.textContent = formatMoney(returnTotal);
        netTotalEl.textContent = formatMoney(grossTotal + returnTotal - penaltyTotal);
      };

      const renderWeekTotals = () => {
        const weekStart = startOfWeek(today);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekStart.getDate() + 6);

        weekRangeEl.textContent = `${weekStart.toLocaleDateString("ru-RU", {
          day: "numeric",
          month: "long",
        })} — ${weekEnd.toLocaleDateString("ru-RU", {
          day: "numeric",
          month: "long",
          year: "numeric",
        })}`;

        let gross = 0;
        let penalty = 0;
        let returns = 0;
        Object.entries(state.days).forEach(([key, value]) => {
          const parts = key.split("-").map((part) => parseInt(part, 10));
          const date =
            parts.length === 3 ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date(key);
          if (date >= weekStart && date <= weekEnd) {
            gross += value.gross || 0;
            penalty += (value.penalties || []).reduce((sum, p) => sum + p.amount, 0);
            returns += (value.returns || []).reduce((sum, r) => sum + r.amount, 0);
          }
        });

        weekGrossEl.textContent = formatMoney(gross);
        weekPenaltyEl.textContent = formatMoney(penalty);
        weekReturnEl.textContent = formatMoney(returns);
        weekNetEl.textContent = formatMoney(gross + returns - penalty);
      };

      const render = () => {
        if (!calendarEl || !monthTitleEl) {
          return;
        }
        monthTitleEl.textContent = current.toLocaleDateString("ru-RU", {
          month: "long",
          year: "numeric",
        });
        renderCalendar();
        renderEditor();
        renderTotals();
        renderWeekTotals();
      };

      const safeRender = () => {
        try {
          render();
        } catch (err) {
          if (calendarEl) {
            calendarEl.innerHTML =
              '<div class="day" style="grid-column: 1 / -1; text-align: center;">Ошибка рендера календаря. Обнови страницу.</div>';
          }
          console.error("Render error:", err);
        }
      };

      const setSyncStatus = (text) => {
        syncStatusEl.textContent = text;
      };

      const loadSyncMeta = () => {
        const raw = localStorage.getItem(SYNC_META_KEY);
        if (!raw) return null;
        try {
          return JSON.parse(raw);
        } catch {
          return null;
        }
      };

      const saveSyncMeta = () => {
        localStorage.setItem(SYNC_META_KEY, JSON.stringify(syncState));
      };

      const syncState = {
        pinHash: null,
        lastPulledAt: null,
        lastPushedAt: null,
        serverUpdatedAt: null,
        pendingChanges: false,
      };

      const hashPin = async (pin) => {
        const data = new TextEncoder().encode(pin);
        const hash = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hash))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      };

      const loadPinFromMeta = () => {
        const meta = loadSyncMeta();
        if (meta && meta.pinHash) {
          Object.assign(syncState, meta);
          setSyncStatus("Автосинхронизация активна.");
          return true;
        }
        return false;
      };

      const pullFromServer = async () => {
        if (!syncState.pinHash) return;
        if (!supabaseClient) {
          setSyncStatus("Синхронизация недоступна в офлайн-режиме.");
          return;
        }
        setSyncStatus("Синхронизация: получаю данные...");
        const { data, error } = await supabaseClient.rpc("get_sync", {
          p_pin_hash: syncState.pinHash,
        });
        if (error) {
          setSyncStatus("Синхронизация: ошибка получения.");
          return;
        }
        if (data && data.length > 0) {
          const row = data[0];
          if (!syncState.pendingChanges) {
            state.days = row.data || {};
            save();
            safeRender();
          }
          syncState.serverUpdatedAt = row.updated_at;
          syncState.lastPulledAt = new Date().toISOString();
          saveSyncMeta();
          setSyncStatus("Синхронизация: данные обновлены.");
        } else {
          setSyncStatus("Синхронизация: данных ещё нет.");
        }
      };

      let syncTimer = null;
      const scheduleSyncPush = () => {
        if (!syncState.pinHash) return;
        if (!supabaseClient) return;
        if (syncTimer) clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
          pushToServer();
        }, 800);
      };

      const pushToServer = async () => {
        if (!syncState.pinHash) return;
        if (!supabaseClient) return;
        if (!syncState.pendingChanges) return;
        setSyncStatus("Синхронизация: отправляю данные...");
        const { data, error } = await supabaseClient.rpc("put_sync", {
          p_pin_hash: syncState.pinHash,
          p_payload: state.days,
        });
        if (error) {
          setSyncStatus("Синхронизация: ошибка отправки.");
          return;
        }
        const updatedAt = data && data.length ? data[0].updated_at : null;
        syncState.serverUpdatedAt = updatedAt;
        syncState.lastPushedAt = new Date().toISOString();
        syncState.pendingChanges = false;
        saveSyncMeta();
        setSyncStatus("Синхронизация: всё сохранено.");
      };

      document.getElementById("prev-month").addEventListener("click", () => {
        current = new Date(current.getFullYear(), current.getMonth() - 1, 1);
        safeRender();
      });
      document.getElementById("next-month").addEventListener("click", () => {
        current = new Date(current.getFullYear(), current.getMonth() + 1, 1);
        safeRender();
      });

      const parseMoneyInput = (raw) => {
        if (!raw) return 0;
        const cleaned = raw.replace(/\s/g, "").replace(",", ".");
        const value = parseFloat(cleaned);
        return isNaN(value) ? 0 : value;
      };

      grossInput.addEventListener("input", () => {
        const value = parseMoneyInput(grossInput.value);
        updateDay(selected, { gross: value });
      });

      document.getElementById("add-penalty").addEventListener("click", () => {
        const amount = parseFloat(penaltyAmount.value || "0");
        if (!amount) return;
        const comment = penaltyComment.value.trim();
        const dayData = getDayData(selected);
        dayData.penalties.push({
          id: crypto.randomUUID(),
          amount,
          comment,
        });
        penaltyAmount.value = "";
        penaltyComment.value = "";
        updateDay(selected, { penalties: dayData.penalties });
      });

      document.getElementById("add-return").addEventListener("click", () => {
        const amount = parseFloat(returnAmount.value || "0");
        if (!amount) return;
        const comment = returnComment.value.trim();
        const dayData = getDayData(selected);
        dayData.returns.push({
          id: crypto.randomUUID(),
          amount,
          comment,
        });
        returnAmount.value = "";
        returnComment.value = "";
        updateDay(selected, { returns: dayData.returns });
      });

      document.getElementById("make-sync").addEventListener("click", () => {
        const data = JSON.stringify(state.days);
        const code = btoa(unescape(encodeURIComponent(data)));
        const url = `${location.origin}${location.pathname}#sync=${code}`;
        syncOutput.value = url;
      });

      document.getElementById("import-sync").addEventListener("click", () => {
        const text = syncInput.value.trim();
        if (!text) return;
        const match = text.match(/#sync=([A-Za-z0-9+/=]+)/);
        const code = match ? match[1] : text;
        try {
          const json = decodeURIComponent(escape(atob(code)));
          const parsed = JSON.parse(json);
          state.days = parsed;
          save();
          safeRender();
        } catch (e) {
          alert("Не удалось импортировать. Проверь код или ссылку.");
        }
      });

      const handleHashSync = () => {
        if (location.hash.startsWith("#sync=")) {
          const code = location.hash.replace("#sync=", "");
          syncInput.value = code;
        }
      };

      window.addEventListener("error", (event) => {
        if (calendarEl) {
          calendarEl.innerHTML =
            '<div class="day" style="grid-column: 1 / -1; text-align: center;">Ошибка скрипта. Обнови страницу.</div>';
        }
        console.error("Window error:", event.error);
      });

      load();
      handleHashSync();
      loadPinFromMeta();
      safeRender();

      if (syncState.pinHash && supabaseClient) {
        pullFromServer();
      } else if (!supabaseClient) {
        setSyncStatus("Оффлайн-режим: синхронизация недоступна.");
      }

      setPinBtn.addEventListener("click", async () => {
        const pin = syncPinInput.value.trim();
        if (!pin || pin.length < 4 || pin.length > 6 || !/^\d+$/.test(pin)) {
          setSyncStatus("PIN должен быть 4–6 цифр.");
          return;
        }
        if (!supabaseClient) {
          setSyncStatus("Синхронизация недоступна в офлайн-режиме.");
          return;
        }
        syncState.pinHash = await hashPin(pin);
        syncState.pendingChanges = true;
        saveSyncMeta();
        setSyncStatus("PIN подключен. Идёт синхронизация...");
        await pullFromServer();
        scheduleSyncPush();
      });
    </script>
  </body>
</html>
